plugins {
    id 'java-library'
    id 'io.freefair.lombok' version "9.2.0"
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation(
            "io.rest-assured:rest-assured:5.4.0",
            "io.rest-assured:json-schema-validator:6.0.0",
            "org.junit.jupiter:junit-jupiter:5.14.3",
            "org.hamcrest:hamcrest:2.2",
            "net.datafaker:datafaker:2.5.4",
            "org.assertj:assertj-core:3.27.7",
            "com.fasterxml.jackson.core:jackson-databind:2.15.2",
            "com.fasterxml.jackson.module:jackson-module-parameter-names:2.15.2",
            "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.15.2",
            "com.fasterxml.jackson.module:jackson-module-blackbird:2.15.2"
    )
}

tasks.withType(Test) {
    useJUnitPlatform()
    systemProperties(System.getProperties())

    testLogging {
        lifecycle {
            events "started", "skipped", "failed", "standard_error", "standard_out"
            exceptionFormat "short"
        }
    }
}